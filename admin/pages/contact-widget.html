<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nút liên hệ nổi — NEO WAVE CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tabler-icons.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="../js/tailwind-config.js"></script>
<link rel="stylesheet" href="../css/admin.css" />
<style>
  /* Mô phỏng đúng .contact-pill / .contact-pill__icon ngoài trang chủ để preview khớp 100% */
  .contact-pill {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 6px 18px 6px 6px; border-radius: 999px; background: #ffffff;
    box-shadow: 0 10px 24px -8px rgba(24,16,34,.22); border: 1px solid rgba(148,132,178,.14);
    font-size: 14px; font-weight: 600; color: #201a2b; white-space: nowrap;
  }
  .contact-pill__icon {
    width: 34px; height: 34px; border-radius: 999px; display: inline-flex;
    align-items: center; justify-content: center; color: #fff; flex: none;
  }
</style>
</head>
<body class="bg-background-light font-body text-slate-800">

  <div class="flex h-screen overflow-hidden">
    <aside class="w-64 border-r border-slate-100 bg-white p-4 overflow-y-auto">
      <div id="sidebar"></div>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
      <header class="h-16 border-b border-slate-100 bg-white flex items-center justify-between px-6 shrink-0">
        <div>
          <p class="text-sm text-slate-400 flex items-center gap-1">
            <a href="../index.html" class="hover:text-primary">Trang chủ</a> <i class="ti ti-chevron-right text-xs"></i> Nút liên hệ nổi
          </p>
          <h1 class="font-display font-medium text-slate-900">Quản lý Nút liên hệ nổi (góc dưới phải trang chủ)</h1>
        </div>
        <div class="flex items-center gap-3">
          <span id="save-status" class="text-xs text-slate-400"></span>
          <button id="btn-save" class="px-4 py-2 rounded-lg bg-primary text-white text-sm font-medium flex items-center gap-1 hover:bg-primary-dark">
            <i class="ti ti-device-floppy"></i> Lưu thay đổi
          </button>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto p-6">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

          <!-- Cột trái: Form -->
          <section class="space-y-6">

            <div class="glass-card rounded-2xl p-6 space-y-3">
              <p class="text-sm font-medium text-slate-700 mb-1">Bật / tắt & tự động mở</p>

              <label class="flex items-center gap-2 text-sm text-slate-600">
                <input type="checkbox" id="enabled-input" />
                Hiển thị widget liên hệ nổi trên trang chủ
              </label>

              <label class="flex items-center gap-2 text-sm text-slate-600">
                <input type="checkbox" id="auto-open-input" />
                Tự động MỞ danh sách nút khi khách vừa vào trang
              </label>

              <label class="flex items-center gap-2 text-sm text-slate-600">
                <input type="checkbox" id="auto-open-once-input" />
                Chỉ tự mở 1 lần mỗi phiên truy cập (không làm phiền khi cuộn qua lại)
              </label>

              <div>
                <label class="text-xs text-slate-500 block mb-1">Độ trễ trước khi tự mở (mili-giây)</label>
                <input id="auto-open-delay-input" type="number" min="0" step="100"
                       class="w-40 px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
              </div>
            </div>

            <div class="glass-card rounded-2xl p-6 space-y-3">
              <div class="flex items-center justify-between">
                <p class="text-sm font-medium text-slate-700">Danh sách nút liên hệ</p>
                <span class="text-xs text-slate-400">Kéo lên/xuống để đổi thứ tự</span>
              </div>
              <div id="buttons-list" class="space-y-3"></div>
              <button type="button" id="btn-add-button" class="btn-add-dashed">
                <i class="ti ti-plus"></i> Thêm nút liên hệ
              </button>
            </div>

          </section>

          <!-- Cột phải: Preview -->
          <section>
            <div class="glass-card rounded-2xl p-6">
              <p class="text-sm font-medium text-slate-700 mb-3">Xem trước</p>
              <div class="rounded-xl border border-slate-100 bg-slate-50 p-8 flex flex-col items-end gap-3">
                <div id="preview-buttons" class="flex flex-col items-end gap-3"></div>
                <div class="w-14 h-14 rounded-full flex items-center justify-center text-white" style="background-color: rgb(0,0,69);">
                  <span class="material-symbols-outlined text-2xl">more_horiz</span>
                </div>
              </div>
              <p id="preview-status" class="text-xs text-slate-500 mt-4"></p>
            </div>
          </section>
        </div>
      </main>

      <footer class="h-16 border-t border-slate-100 bg-white flex items-center justify-between px-6 shrink-0">
        <button id="btn-undo" class="px-4 py-2 rounded-lg border border-slate-200 text-sm text-slate-600 flex items-center gap-1 hover:bg-slate-50">
          <i class="ti ti-refresh"></i> Làm lại
        </button>
        <div class="flex gap-3">
          <button id="btn-cancel" class="px-4 py-2 rounded-lg border border-slate-200 text-sm text-slate-600 hover:bg-slate-50">Hủy bỏ</button>
          <button id="btn-save-bottom" class="px-4 py-2 rounded-lg bg-primary text-white text-sm font-medium flex items-center gap-1 hover:bg-primary-dark">
            <i class="ti ti-device-floppy"></i> Lưu thay đổi
          </button>
        </div>
      </footer>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from "../js/auth-guard.js";
    import { renderSidebar } from "../js/sidebar.js";
    import { initContactWidgetPage } from "../js/contact-widget-section.js";

    renderSidebar("contact-widget", "../");

    requireAuth({
      loginPath: "../login.html",
      onReady: (user) => initContactWidgetPage(user),
    });
  </script>
</body>
</html>
