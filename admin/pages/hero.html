<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hero Section — NEO WAVE CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tabler-icons.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../js/tailwind-config.js"></script>
<link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="bg-background-light font-body text-slate-800">

  <div class="flex h-screen overflow-hidden">
    <aside class="w-64 border-r border-slate-100 bg-white p-4 overflow-y-auto">
      <div id="sidebar"></div>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- Header -->
      <header class="h-16 border-b border-slate-100 bg-white flex items-center justify-between px-6 shrink-0">
        <div>
          <p class="text-sm text-slate-400 flex items-center gap-1">
            <a href="../index.html" class="hover:text-primary">Trang chủ</a> <i class="ti ti-chevron-right text-xs"></i> Hero Section
          </p>
          <h1 class="font-display font-medium text-slate-900">Quản lý nội dung section Banner (Hero) trên trang chủ</h1>
        </div>
        <div class="flex items-center gap-3">
          <span id="save-status" class="text-xs text-slate-400"></span>
          <button id="btn-save" class="px-4 py-2 rounded-lg bg-primary text-white text-sm font-medium flex items-center gap-1 hover:bg-primary-dark">
            <i class="ti ti-device-floppy"></i> Lưu thay đổi
          </button>
        </div>
      </header>

      <!-- Body -->
      <main class="flex-1 overflow-y-auto p-6">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

          <!-- Cột trái: Form -->
          <section class="glass-card rounded-2xl p-6 space-y-5">
            <div>
              <div class="flex justify-between mb-1">
                <label class="text-sm font-medium text-slate-700">Eyebrow (Nhãn nhỏ)</label>
                <span id="eyebrow-counter" class="char-counter">0/80</span>
              </div>
              <input id="eyebrow-input" maxlength="80" type="text"
                     class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
            </div>

            <div>
              <div class="flex justify-between mb-1">
                <label class="text-sm font-medium text-slate-700">Tiêu đề chính</label>
                <span id="title-counter" class="char-counter">0/120</span>
              </div>
              <textarea id="title-input" maxlength="120" rows="3"
                        class="field-textarea w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40"></textarea>
              <input id="title-highlight-input" type="text" placeholder="Cụm từ cần tô gradient (VD: Chuẩn SEO)"
                     class="mt-2 w-full px-3 py-2 rounded-lg border border-slate-200 text-xs text-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/40" />
            </div>

            <div>
              <div class="flex justify-between mb-1">
                <label class="text-sm font-medium text-slate-700">Mô tả</label>
                <span id="description-counter" class="char-counter">0/200</span>
              </div>
              <textarea id="description-input" maxlength="200" rows="3"
                        class="field-textarea w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="text-sm font-medium text-slate-700 block mb-1">Nút chính (Primary)</label>
                <input id="primary-text-input" type="text"
                       class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm mb-2 focus:outline-none focus:ring-2 focus:ring-primary/40" />
                <label class="text-xs text-slate-500 block mb-1">Link</label>
                <input id="primary-link-input" type="text"
                       class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
              </div>
              <div>
                <label class="text-sm font-medium text-slate-700 block mb-1">Nút phụ (Secondary)</label>
                <input id="secondary-text-input" type="text"
                       class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm mb-2 focus:outline-none focus:ring-2 focus:ring-primary/40" />
                <label class="text-xs text-slate-500 block mb-1">Link</label>
                <input id="secondary-link-input" type="text"
                       class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
              </div>
            </div>

            <div>
              <label class="text-sm font-medium text-slate-700 block mb-1">Trust badges (phân tách bằng dấu phẩy)</label>
              <input id="trust-badges-input" type="text"
                     class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="text-sm font-medium text-slate-700 block mb-1">Nhãn thẻ nổi</label>
                <input id="stat-label-input" type="text"
                       class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
              </div>
              <div>
                <label class="text-sm font-medium text-slate-700 block mb-1">Giá trị thẻ nổi</label>
                <input id="stat-value-input" type="text"
                       class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
              </div>
            </div>
          </section>

          <!-- Cột phải: Preview + Upload -->
          <section class="space-y-6">
            <div class="glass-card rounded-2xl p-6">
              <p class="text-sm font-medium text-slate-700 mb-3">Hình ảnh Hero</p>
              <div class="bg-hero-gradient rounded-xl p-6 relative overflow-hidden">
                <div class="flex items-center gap-2 mb-4">
                  <div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-white text-xs font-bold">N</div>
                  <span class="font-display text-sm font-bold text-slate-900">NEO WAVE</span>
                </div>
                <span id="preview-eyebrow" class="inline-block text-[10px] font-medium text-primary bg-primary/10 px-2 py-1 rounded-full mb-3"></span>
                <h2 id="preview-title" class="font-display text-xl font-bold text-slate-900 leading-snug mb-2"></h2>
                <p id="preview-description" class="text-xs text-slate-500 mb-4 max-w-xs"></p>
                <div class="flex gap-2 mb-4">
                  <span id="preview-primary-btn" class="px-3 py-1.5 rounded-full bg-primary text-white text-xs font-medium"></span>
                  <span id="preview-secondary-btn" class="px-3 py-1.5 rounded-full bg-white text-slate-700 text-xs font-medium border border-slate-200"></span>
                </div>
                <div id="preview-badges" class="flex flex-wrap gap-3 text-[10px] text-slate-500 mb-4"></div>
                <img id="preview-image" class="w-full rounded-lg hidden" alt="Hero preview" />
                <div class="absolute top-4 right-4 glass-card rounded-lg px-2 py-1 text-[10px]">
                  <span id="preview-stat-label" class="block text-slate-500"></span>
                  <span id="preview-stat-value" class="block font-bold text-primary"></span>
                </div>
              </div>
              <button id="btn-change-image" onclick="document.getElementById('image-file-input').click()"
                      class="mt-4 w-full py-2 rounded-lg border border-slate-200 text-sm text-slate-600 flex items-center justify-center gap-1 hover:bg-slate-50">
                <i class="ti ti-photo-edit"></i> Thay đổi hình ảnh
              </button>
            </div>

            <div class="glass-card rounded-2xl p-6">
              <p class="text-sm font-medium text-slate-700 mb-3">Upload hình ảnh</p>
              <div id="image-dropzone" class="dropzone rounded-xl p-8 text-center cursor-pointer"
                   onclick="document.getElementById('image-file-input').click()">
                <i class="ti ti-cloud-upload text-3xl text-slate-400 mb-2"></i>
                <p class="text-sm text-slate-500">Kéo &amp; thả hình ảnh vào đây</p>
                <p class="text-xs text-slate-400 mb-3">Hoặc</p>
                <span class="px-4 py-2 rounded-lg bg-primary text-white text-sm font-medium">Chọn từ máy tính</span>
              </div>
              <input id="image-file-input" type="file" accept="image/*" class="hidden" />
              <p id="upload-status" class="text-xs text-slate-400 mt-2"></p>
              <p class="text-xs text-slate-400 mt-1">Định dạng: JPG, PNG, WEBP – Kích thước đề xuất: 1600x900px</p>
            </div>
          </section>
        </div>
      </main>

      <!-- Footer action bar -->
      <footer class="h-16 border-t border-slate-100 bg-white flex items-center justify-between px-6 shrink-0">
        <button id="btn-undo" class="px-4 py-2 rounded-lg border border-slate-200 text-sm text-slate-600 flex items-center gap-1 hover:bg-slate-50">
          <i class="ti ti-refresh"></i> Làm lại
        </button>
        <div class="flex gap-3">
          <button id="btn-cancel" class="px-4 py-2 rounded-lg border border-slate-200 text-sm text-slate-600 hover:bg-slate-50">Hủy bỏ</button>
          <button id="btn-save-bottom" class="px-4 py-2 rounded-lg bg-primary text-white text-sm font-medium flex items-center gap-1 hover:bg-primary-dark">
            <i class="ti ti-device-floppy"></i> Lưu thay đổi
          </button>
        </div>
      </footer>
    </div>
  </div>

  <script type="module">
    import { requireAuth, logout } from "../js/auth-guard.js";
    import { renderSidebar } from "../js/sidebar.js";
    import { initHeroPage } from "../js/hero-section.js";

    renderSidebar("hero", "../");

    requireAuth({
      loginPath: "../login.html",
      onReady: (user) => initHeroPage(user),
    });

    // Kéo-thả ảnh vào dropzone
    const dropzone = document.getElementById("image-dropzone");
    const fileInput = document.getElementById("image-file-input");
    ["dragenter", "dragover"].forEach((evt) =>
      dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add("dropzone-active"); })
    );
    ["dragleave", "drop"].forEach((evt) =>
      dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove("dropzone-active"); })
    );
    dropzone.addEventListener("drop", (e) => {
      const file = e.dataTransfer.files[0];
      if (file) {
        fileInput.files = e.dataTransfer.files;
        fileInput.dispatchEvent(new Event("change"));
      }
    });
  </script>
</body>
</html>
