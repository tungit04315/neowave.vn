<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Header — NEO WAVE CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tabler-icons.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../js/tailwind-config.js"></script>
<link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="bg-background-light font-body text-slate-800">

  <div class="flex h-screen overflow-hidden">
    <aside class="w-64 border-r border-slate-100 bg-white p-4 overflow-y-auto">
      <div id="sidebar"></div>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
      <header class="h-16 border-b border-slate-100 bg-white flex items-center justify-between px-6 shrink-0">
        <div>
          <p class="text-sm text-slate-400 flex items-center gap-1">
            <a href="../index.html" class="hover:text-primary">Trang chủ</a> <i class="ti ti-chevron-right text-xs"></i> Header
          </p>
          <h1 class="font-display font-medium text-slate-900">Quản lý Header — logo, menu điều hướng, nút CTA</h1>
        </div>
        <div class="flex items-center gap-3">
          <span id="save-status" class="text-xs text-slate-400"></span>
          <button id="btn-save" class="px-4 py-2 rounded-lg bg-primary text-white text-sm font-medium flex items-center gap-1 hover:bg-primary-dark">
            <i class="ti ti-device-floppy"></i> Lưu thay đổi
          </button>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto p-6">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

          <!-- Cột trái: Form -->
          <section class="space-y-6">

            <div class="glass-card rounded-2xl p-6 space-y-4">
              <p class="text-sm font-medium text-slate-700">Logo</p>
              <div class="flex items-center gap-3">
                <button type="button" id="btn-change-logo" onclick="document.getElementById('logo-file-input').click()"
                        class="px-3 py-2 rounded-lg border border-slate-200 text-sm text-slate-600 hover:bg-slate-50 flex items-center gap-1">
                  <i class="ti ti-photo-up"></i> Tải logo ảnh
                </button>
                <button type="button" id="btn-use-text-logo"
                        class="px-3 py-2 rounded-lg border border-slate-200 text-sm text-slate-600 hover:bg-slate-50">
                  Dùng logo chữ
                </button>
                <input id="logo-file-input" type="file" accept="image/*" class="hidden" />
              </div>
              <p id="logo-upload-status" class="text-xs text-slate-400"></p>
              <div>
                <label class="text-sm font-medium text-slate-700 block mb-1">Logo chữ (khi không dùng ảnh)</label>
                <input id="logo-text-input" type="text"
                       class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
              </div>
            </div>

            <div class="glass-card rounded-2xl p-6 space-y-3">
              <div class="flex items-center justify-between">
                <p class="text-sm font-medium text-slate-700">Menu điều hướng</p>
                <span class="text-xs text-slate-400">Nhãn — Đường dẫn</span>
              </div>
              <div id="nav-items-list"></div>
              <button type="button" id="btn-add-nav-item" class="btn-add-dashed">
                <i class="ti ti-plus"></i> Thêm mục menu
              </button>
            </div>

            <div class="glass-card rounded-2xl p-6 space-y-4">
              <div class="flex items-center justify-between">
                <p class="text-sm font-medium text-slate-700">Nút CTA (góc phải header)</p>
                <label class="inline-flex items-center gap-2 text-xs text-slate-500 cursor-pointer">
                  <input type="checkbox" id="cta-enabled-input" />
                  Hiển thị
                </label>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="text-xs text-slate-500 block mb-1">Nội dung nút</label>
                  <input id="cta-text-input" type="text"
                         class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
                </div>
                <div>
                  <label class="text-xs text-slate-500 block mb-1">Link</label>
                  <input id="cta-link-input" type="text"
                         class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
                </div>
              </div>
            </div>

            <div class="glass-card rounded-2xl p-6">
              <label class="inline-flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
                <input type="checkbox" id="sticky-input" />
                Header dính khi cuộn trang (sticky)
              </label>
            </div>

          </section>

          <!-- Cột phải: Preview -->
          <section>
            <div class="glass-card rounded-2xl p-6">
              <p class="text-sm font-medium text-slate-700 mb-3">Xem trước</p>
              <div class="rounded-xl border border-slate-100 overflow-hidden">
                <div class="h-14 bg-white border-b border-slate-100 flex items-center justify-between px-4">
                  <div class="flex items-center gap-2">
                    <img id="preview-logo-image" class="h-7 hidden" alt="Logo" />
                    <span id="preview-logo-text" class="font-display font-bold text-slate-900 text-sm"></span>
                  </div>
                  <nav id="preview-nav" class="hidden md:flex items-center gap-1 text-xs text-slate-600"></nav>
                  <span id="preview-cta" class="px-3 py-1.5 rounded-full bg-primary text-white text-xs font-medium"></span>
                </div>
                <div class="p-6 text-center text-xs text-slate-400 bg-hero-gradient">
                  Nội dung trang bên dưới header...
                </div>
              </div>
              <p id="preview-sticky-note" class="text-xs text-slate-400 mt-3"></p>
            </div>
          </section>
        </div>
      </main>

      <footer class="h-16 border-t border-slate-100 bg-white flex items-center justify-between px-6 shrink-0">
        <button id="btn-undo" class="px-4 py-2 rounded-lg border border-slate-200 text-sm text-slate-600 flex items-center gap-1 hover:bg-slate-50">
          <i class="ti ti-refresh"></i> Làm lại
        </button>
        <div class="flex gap-3">
          <button id="btn-cancel" class="px-4 py-2 rounded-lg border border-slate-200 text-sm text-slate-600 hover:bg-slate-50">Hủy bỏ</button>
          <button id="btn-save-bottom" class="px-4 py-2 rounded-lg bg-primary text-white text-sm font-medium flex items-center gap-1 hover:bg-primary-dark">
            <i class="ti ti-device-floppy"></i> Lưu thay đổi
          </button>
        </div>
      </footer>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from "../js/auth-guard.js";
    import { renderSidebar } from "../js/sidebar.js";
    import { initHeaderPage } from "../js/header-section.js";

    renderSidebar("header", "../");

    requireAuth({
      loginPath: "../login.html",
      onReady: (user) => initHeaderPage(user),
    });
  </script>
</body>
</html>
