<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CTA — NEO WAVE CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tabler-icons.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../js/tailwind-config.js"></script>
<link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="bg-background-light font-body text-slate-800">

  <div class="flex h-screen overflow-hidden">
    <aside class="w-64 border-r border-slate-100 bg-white p-4 overflow-y-auto">
      <div id="sidebar"></div>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
      <header class="h-16 border-b border-slate-100 bg-white flex items-center justify-between px-6 shrink-0">
        <div>
          <p class="text-sm text-slate-400 flex items-center gap-1">
            <a href="../index.html" class="hover:text-primary">Trang chủ</a> <i class="ti ti-chevron-right text-xs"></i> CTA
          </p>
          <h1 class="font-display font-medium text-slate-900">Quản lý khối kêu gọi hành động (CTA) trên trang chủ</h1>
        </div>
        <div class="flex items-center gap-3">
          <span id="save-status" class="text-xs text-slate-400"></span>
          <button id="btn-save" class="px-4 py-2 rounded-lg bg-primary text-white text-sm font-medium flex items-center gap-1 hover:bg-primary-dark">
            <i class="ti ti-device-floppy"></i> Lưu thay đổi
          </button>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto p-6">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

          <!-- Cột trái: Form -->
          <section class="space-y-6">
            <div class="glass-card rounded-2xl p-6 space-y-5">
              <div>
                <div class="flex justify-between mb-1">
                  <label class="text-sm font-medium text-slate-700">Tiêu đề</label>
                  <span id="title-counter" class="char-counter">0/120</span>
                </div>
                <input id="title-input" maxlength="120" type="text"
                       class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
              </div>
              <div>
                <div class="flex justify-between mb-1">
                  <label class="text-sm font-medium text-slate-700">Mô tả</label>
                  <span id="description-counter" class="char-counter">0/220</span>
                </div>
                <textarea id="description-input" maxlength="220" rows="3"
                          class="field-textarea w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40"></textarea>
              </div>
            </div>

            <div class="glass-card rounded-2xl p-6 space-y-3">
              <p class="text-sm font-medium text-slate-700">Nút chính (nền trắng)</p>
              <div class="grid grid-cols-2 gap-3">
                <input id="primary-text-input" type="text" placeholder="Nội dung nút"
                       class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
                <input id="primary-link-input" type="text" placeholder="Link"
                       class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
              </div>
            </div>

            <div class="glass-card rounded-2xl p-6 space-y-3">
              <p class="text-sm font-medium text-slate-700">Nút phụ (viền trắng)</p>
              <div class="grid grid-cols-2 gap-3">
                <input id="secondary-text-input" type="text" placeholder="Nội dung nút"
                       class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
                <input id="secondary-link-input" type="text" placeholder="Link"
                       class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
              </div>
            </div>
          </section>

          <!-- Cột phải: Preview -->
          <section>
            <div class="glass-card rounded-2xl p-6">
              <p class="text-sm font-medium text-slate-700 mb-3">Xem trước</p>
              <div class="rounded-2xl bg-primary p-8 text-center">
                <h2 id="preview-title" class="text-xl font-display font-bold text-white mb-2"></h2>
                <p id="preview-description" class="text-white/80 text-xs max-w-sm mx-auto mb-5"></p>
                <div class="flex items-center justify-center gap-3">
                  <span id="preview-primary-btn" class="px-4 py-2 rounded-full bg-white text-primary text-xs font-bold"></span>
                  <span id="preview-secondary-btn" class="px-4 py-2 rounded-full border-2 border-white text-white text-xs font-bold"></span>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>

      <footer class="h-16 border-t border-slate-100 bg-white flex items-center justify-between px-6 shrink-0">
        <button id="btn-undo" class="px-4 py-2 rounded-lg border border-slate-200 text-sm text-slate-600 flex items-center gap-1 hover:bg-slate-50">
          <i class="ti ti-refresh"></i> Làm lại
        </button>
        <div class="flex gap-3">
          <button id="btn-cancel" class="px-4 py-2 rounded-lg border border-slate-200 text-sm text-slate-600 hover:bg-slate-50">Hủy bỏ</button>
          <button id="btn-save-bottom" class="px-4 py-2 rounded-lg bg-primary text-white text-sm font-medium flex items-center gap-1 hover:bg-primary-dark">
            <i class="ti ti-device-floppy"></i> Lưu thay đổi
          </button>
        </div>
      </footer>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from "../js/auth-guard.js";
    import { renderSidebar } from "../js/sidebar.js";
    import { initCtaPage } from "../js/cta-section.js";

    renderSidebar("cta", "../");

    requireAuth({
      loginPath: "../login.html",
      onReady: (user) => initCtaPage(user),
    });
  </script>
</body>
</html>
